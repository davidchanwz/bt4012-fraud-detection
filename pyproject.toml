[project]
name = "bt4012-fraud-detection"
version = "0.1.0"
description = "BT4012 Group 07: graph features for fraud detection on BankSim"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "lightgbm>=4.7.0",
    "streamlit>=1.66",
    "plotly>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyter>=1.0",
]

[tool.uv]
# not an installable package -- we just run scripts with `uv run python -m src...`
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
