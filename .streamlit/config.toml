# Dashboard theme (app/). Neutral surfaces, one blue accent; chart colours come from app/ui.py.
[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
baseRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#2a78d6"
# badge colours match the txn (blue) / txn + graph (orange) series colours in app/ui.py
blueColor = "#2a78d6"
orangeColor = "#eb6834"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#fcfcfb"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#3987e5"
blueColor = "#3987e5"
orangeColor = "#d95926"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#1a1a19"
